<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-label="NEXT360">
  <defs>
    <linearGradient id="olive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a9469"/>
      <stop offset=".5" stop-color="#54744c"/>
      <stop offset="1" stop-color="#3d5437"/>
    </linearGradient>
    <linearGradient id="charcoal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343c44"/>
      <stop offset="1" stop-color="#2c343c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- orbit emblem -->
  <g transform="translate(88 80)" filter="url(#glow)">
    <circle r="52" fill="none" stroke="url(#olive)" stroke-width="2.5" stroke-dasharray="240 88" stroke-linecap="round" transform="rotate(-38)"/>
    <circle r="40" fill="none" stroke="url(#olive)" stroke-width="3.5"/>
    <text y="14" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="34" fill="url(#olive)">N</text>
  </g>

  <!-- wordmark -->
  <g font-family="Cinzel, Georgia, serif" font-weight="700" letter-spacing="6">
    <text x="168" y="98" font-size="56" fill="#343c44">NEXT</text>
    <text x="392" y="98" font-size="56" fill="url(#olive)">360</text>
  </g>
  <text x="172" y="128" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="7.5" fill="#54744c">A NEW BEGINNING</text>
</svg>
