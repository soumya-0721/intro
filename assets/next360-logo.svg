<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-label="NEXT360">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e4ad"/>
      <stop offset=".45" stop-color="#e3b95e"/>
      <stop offset="1" stop-color="#c99636"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#82c1ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- orbit emblem -->
  <g transform="translate(88 80)" filter="url(#glow)">
    <circle r="52" fill="none" stroke="url(#blue)" stroke-width="2.5" stroke-dasharray="240 88" stroke-linecap="round" transform="rotate(-38)"/>
    <circle r="40" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
    <text y="14" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="34" fill="url(#gold)">N</text>
  </g>

  <!-- wordmark -->
  <g font-family="Cinzel, Georgia, serif" font-weight="700" letter-spacing="6">
    <text x="168" y="98" font-size="56" fill="#eef2fa">NEXT</text>
    <text x="392" y="98" font-size="56" fill="url(#gold)">360</text>
  </g>
  <text x="172" y="128" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="7.5" fill="#6d7a96">A NEW BEGINNING</text>
</svg>
